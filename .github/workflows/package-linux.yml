name: Package (Linux)

# Manual build of the Linux artifacts (tarball / deb / rpm / AppImage) as
# workflow artifacts, for testing packaging without cutting a release. The
# actual release publishing happens in release.yml on a version tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build + packaging tools
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin libfontconfig-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Resolve version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries (GUI + TUI)
        run: cargo build --release --bin neonprime-linux --bin neonprime-tui

      - name: Tarball
        run: bash packaging/linux/build-tarball.sh "${{ steps.ver.outputs.version }}"

      - name: Deb
        run: cargo deb --no-build

      - name: Rpm
        run: cargo generate-rpm

      - name: AppImage
        run: bash packaging/linux/build-appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neonprime-linux-${{ steps.ver.outputs.version }}
          path: |
            NeonPrime-*-linux-*.tar.gz
            NeonPrime-*-*.AppImage
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: warn
